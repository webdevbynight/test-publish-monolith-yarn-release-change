name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Yarn and setup Node.js
        uses: ./.github/actions/yarn-node
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build the package
        run: yarn build
      - name: Release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ISSUE_PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: yarn dlx @release-change/cli
